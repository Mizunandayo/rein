version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "hypothesis"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      # CodeQL's init and analyze steps must always be on the same version:
      # CodeQL refuses to run when they differ. One PR moves both.
      codeql:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "weekly", day: "monday" }
