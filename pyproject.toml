# ═══════════════════════════════════════════════════════════════════
#  PROJECT METADATA
# ═══════════════════════════════════════════════════════════════════
[project]
name            = "rein"
version         = "0.1.0"
description     = "Fairness-first drone corridor planning. Solves for the worst-off household, not the average."
readme          = "README.md"
requires-python = ">=3.12"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "<YOUR FULL NAME>" }]
keywords        = ["mcp", "acoustics", "fairness", "leximin", "drone-delivery", "urban-planning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]

# Runtime dependencies. Lower bounds only — uv.lock pins the exact build.
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pyogrio>=0.10",          # fast vector I/O, replaces the fiona/GDAL dance
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Phase 1 verification work only. Keeps the core install lean.
verify = [
  "osmnx>=2.0",
  "matplotlib>=3.9",
]

[project.scripts]
rein-verify-tiles  = "rein.verification.tiles:main"
rein-verify-burden = "rein.verification.burden_benefit:main"

# PEP 735 dependency groups — dev tools that are never shipped.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.168.1",
  "ruff>=0.16.9",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "pandas-stubs",
  "types-shapely",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rein"]

# ═══════════════════════════════════════════════════════════════════
#  RUFF — linter + formatter (replaces black, isort, flake8, pyupgrade)
# ═══════════════════════════════════════════════════════════════════
[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # import sorting
  "N",          # pep8 naming
  "UP",         # pyupgrade — modernise syntax
  "B",          # bugbear — real bug patterns
  "A",          # shadowing builtins
  "C4",         # comprehension quality
  "DTZ",        # naive datetimes (a real correctness bug for scheduling)
  "T20",        # no print() — use the logger
  "SIM",        # simplifications
  "PTH",        # use pathlib, not os.path
  "NPY",        # numpy legacy patterns
  "RUF",
  "S",          # bandit security rules
  "ANN",        # require type annotations
  "D",          # docstrings
]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "ANN401",  # Any is occasionally correct at boundaries
  "S101",    # assert — allowed, see per-file override
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use magic numbers, and skip docstrings.
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "ANN201", "PLR2004"]
"scripts/**"    = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

# ═══════════════════════════════════════════════════════════════════
#  MYPY — strict from day one
# ═══════════════════════════════════════════════════════════════════
[tool.mypy]
python_version         = "3.12"
strict                 = true
warn_unreachable       = true
warn_return_any        = true
disallow_any_generics  = true
show_error_codes       = true
pretty                 = true
files                  = ["src", "tests"]

# Scientific libraries ship incomplete stubs. Silence only these,
# never your own code.
[[tool.mypy.overrides]]
module = ["osmnx.*", "geopandas.*", "pyogrio.*", "matplotlib.*", "scipy.*", "shapely.*"]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════════════
#  PYTEST
# ═══════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=rein",
  "--cov-report=term-missing",
  "--cov-fail-under=70",
]
markers = [
  "network: hits a live external API (deselect with '-m \"not network\"')",
  "slow: takes more than a second",
]
filterwarnings = ["error", "ignore::DeprecationWarning:osmnx.*"]

[tool.coverage.run]
branch = true
source = ["src/rein"]
