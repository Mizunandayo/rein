# Hooksrun automatically on `git commit`. They are the cheapest possible place to
# catch a misatk


default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # .gitattributes checks PowerShell and batch files out with CRLF.
        # Forcing them to LF here fails every fresh clone.
        exclude: '\.(ps1|psm1|cmd|bat)$'
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Types
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: blueprint-guard
        name: private blueprint must not be staged
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-blueprint-not-staged.ps1
        language: system
        pass_filenames: false
        always_run: true
